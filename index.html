<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Chuyến Bay - Live GPS Radar</title>
    
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- MapLibre & Turf.js cho bản đồ và tính toán tọa độ -->
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        body { 
            font-family: 'Inter', sans-serif; background-color: var(--bg-dark); 
            color: var(--text-light); margin: 0; padding: 30px 15px; 
            display: flex; flex-direction: column; align-items: center; 
        }

        .container { 
            max-width: 650px; width: 100%; background: var(--card-bg); 
            border-radius: 16px; padding: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(56, 189, 248, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 { text-align: center; color: var(--primary); margin-top: 0; font-size: 24px; }
        
        /* Box Tìm kiếm & Gợi ý (Từ bản đầu tiên) */
        .search-container { position: relative; width: 100%; margin-bottom: 25px; }
        .search-box { display: flex; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border-radius: 10px; }
        input[type="text"] { 
            flex: 1; padding: 16px 20px; font-size: 16px; background: rgba(15, 23, 42, 0.6); 
            border: 1px solid #334155; color: white; border-radius: 10px 0 0 10px; outline: none; 
            text-transform: uppercase; font-weight: 600;
        }
        input[type="text"]:focus { border-color: var(--primary); background: rgba(15, 23, 42, 0.9); }
        button.search-btn { 
            padding: 16px 28px; font-size: 16px; background: var(--primary); color: #000; 
            border: none; border-radius: 0 10px 10px 0; cursor: pointer; font-weight: 800; transition: 0.3s;
        }
        button.search-btn:hover { background: var(--primary-hover); color: #fff; }
        
        .suggestions { 
            position: absolute; top: 100%; left: 0; right: 120px; background: var(--card-bg); 
            border: 1px solid #334155; border-top: none; border-radius: 0 0 10px 10px; z-index: 1000; display: none; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); overflow: hidden;
        }
        .suggestion-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #334155; font-size: 14px;}
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: rgba(56, 189, 248, 0.1); color: var(--primary); }

        .result-card { 
            display: none; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); 
            border-radius: 16px; padding: 25px; border-top: 4px solid var(--primary); 
            position: relative; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Huy hiệu GPS */
        .gps-badge { 
            position: absolute; top: -16px; right: 25px; background: var(--success); color: white; 
            padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 800; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px;
        }
        .gps-badge.simulated { background: var(--warning); color: #000;}
        .blinking-dot { width: 8px; height: 8px; background: currentColor; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.2;} 100% {opacity: 1;} }

        /* Hiển thị Lộ trình (Phong cách bản đầu tiên nhưng hiện đại hơn) */
        .route { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 0 10px; }
        .city { font-size: 38px; font-weight: 800; color: #fff; }
        .time { font-size: 18px; color: var(--text-muted); font-weight: 600; margin-top: 5px;}
        
        .flight-path { flex: 1; text-align: center; position: relative; margin: 0 20px; border-bottom: 2px dashed #475569; }
        .flight-path span { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 0 10px; font-size: 24px; color: var(--primary); }

        /* Khối thông tin bay nổi bật */
        .details { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            background: rgba(15, 23, 42, 0.5); padding: 20px; border-radius: 12px; 
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05);
        }
        .detail-item { display: flex; flex-direction: column; gap: 4px; }
        .detail-label { font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;}
        .detail-value { font-size: 18px; color: #fff; font-weight: 800; }
        .val-highlight { color: var(--primary); }
        
        /* Nút Báo Thức */
        .action-buttons { display: flex; justify-content: center; margin-bottom: 20px; }
        .alarm-btn {
            background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid var(--primary);
            padding: 10px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif;
        }
        .alarm-btn:hover { background: var(--primary); color: #0f172a; transform: scale(1.05); }

        /* Bản đồ */
        #map { height: 350px; width: 100%; border-radius: 12px; border: 1px solid #334155; overflow: hidden; }
        .plane-marker { width: 32px; height: 32px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8)); transition: transform 0.5s linear; }
    </style>
</head>
<body>

<div class="container">
    <h2>✈️ Tra Cứu Chuyến Bay - Hệ Thống Hàng Không</h2>
    
    <div class="search-container">
        <div class="search-box">
            <input type="text" id="flightInput" placeholder="Nhập mã (VD: VU750, VN123)" autocomplete="off">
            <button class="search-btn" onclick="searchFlight()">Tra Cứu</button>
        </div>
        <!-- Thanh gợi ý Auto-complete từ bản đầu tiên -->
        <div id="suggestions" class="suggestions"></div>
    </div>

    <div id="result" class="result-card">
        <div id="gpsBadge" class="gps-badge simulated">
            <div class="blinking-dot"></div> <span id="gpsText">Đang tìm tín hiệu...</span>
        </div>

        <!-- Lộ trình đứt nét trực quan -->
        <div class="route">
            <div style="text-align: left;">
                <div id="depCity" class="city">SGN</div>
                <div id="depTime" class="time">05:35</div>
            </div>
            <div class="flight-path">
                <span>✈️</span>
            </div>
            <div style="text-align: right;">
                <div id="arrCity" class="city">HAN</div>
                <div id="arrTime" class="time">07:45</div>
            </div>
        </div>

        <!-- Bảng thông tin nổi bật -->
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">Hãng hàng không</span>
                <span class="detail-value" id="airline">Vietravel Airlines</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Trạng thái</span>
                <span class="detail-value val-highlight" id="status" style="color: var(--success);">Đang bay</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Độ cao (Alt)</span>
                <span class="detail-value val-highlight" id="altitude">Đang lấy...</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Tốc độ (Speed)</span>
                <span class="detail-value val-highlight" id="speed">Đang lấy...</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="alarm-btn" onclick="setAlarm()">🔔 Lưu báo thức hành trình</button>
        </div>

        <div id="map"></div>
    </div>
</div>

<script>
    // Dữ liệu mẫu (Có thể mở rộng thêm)
    const flightData = {
        "VU750": { dep: "SGN", arr: "HAN", depTime: "05:35", arrTime: "07:45", airline: "Vietravel Airlines", coords: [[10.818, 106.652], [21.218, 105.804]] },
        "VN123": { dep: "HAN", arr: "SGN", depTime: "10:00", arrTime: "12:15", airline: "Vietnam Airlines", coords: [[21.218, 105.804], [10.818, 106.652]] },
        "VN300": { dep: "SGN", arr: "NRT", depTime: "00:15", arrTime: "07:45", airline: "Vietnam Airlines", coords: [[10.818, 106.652], [35.772, 140.392]] }, 
        "VJ198": { dep: "SGN", arr: "HAN", depTime: "14:30", arrTime: "16:40", airline: "VietJet Air", coords: [[10.818, 106.652], [21.218, 105.804]] },
        "QH202": { dep: "SGN", arr: "HAN", depTime: "09:00", arrTime: "11:15", airline: "Bamboo Airways", coords: [[10.818, 106.652], [21.218, 105.804]] }
    };

    let map = null, planeMarker = null, liveGpsInterval = null, currentFlightCode = "", currentFlightInfo = null;
    
    const flightInput = document.getElementById('flightInput');
    const suggestionsBox = document.getElementById('suggestions');

    // 1. Tính năng Gợi ý khi gõ (Autocomplete)
    flightInput.addEventListener('input', function() {
        const val = this.value.toUpperCase();
        suggestionsBox.innerHTML = '';
        if (!val) { suggestionsBox.style.display = 'none'; return; }
        
        let matches = Object.keys(flightData).filter(key => key.includes(val));
        if (matches.length > 0) {
            suggestionsBox.style.display = 'block';
            matches.forEach(match => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `<strong>${match}</strong> - ${flightData[match].airline} (${flightData[match].dep} ➔ ${flightData[match].arr})`;
                div.onclick = function() {
                    flightInput.value = match;
                    suggestionsBox.style.display = 'none';
                    searchFlight();
                };
                suggestionsBox.appendChild(div);
            });
        } else { suggestionsBox.style.display = 'none'; }
    });
    
    // Ẩn gợi ý khi click ra ngoài
    document.addEventListener('click', e => { if(e.target !== flightInput) suggestionsBox.style.display = 'none'; });
    flightInput.addEventListener("keypress", e => { if (e.key === "Enter") { e.preventDefault(); searchFlight(); } });

    // 2. Nút Báo thức
    function setAlarm() {
        if(currentFlightInfo) alert(`✅ Đã thiết lập báo thức cho chuyến ${currentFlightCode}.\nHệ thống sẽ nhắc cậu chủ trước giờ khởi hành (${currentFlightInfo.depTime}) và giờ đến (${currentFlightInfo.arrTime}).`);
    }

    // 3. API OpenSky lấy GPS thực tế
    function getIcaoCallsign(iata) {
        if(iata.startsWith('VU')) return iata.replace('VU', 'VTV');
        if(iata.startsWith('VN')) return iata.replace('VN', 'HVN');
        if(iata.startsWith('VJ')) return iata.replace('VJ', 'VJC');
        if(iata.startsWith('QH')) return iata.replace('QH', 'BAV');
        return iata; 
    }

    async function fetchLiveGPS(icaoCallsign) {
        try {
            const response = await fetch('https://opensky-network.org/api/states/all?lamin=-10&lomin=90&lamax=50&lomax=150');
            const data = await response.json();
            if (!data || !data.states) return null;
            const flight = data.states.find(s => s[1] && s[1].trim() === icaoCallsign);
            if (flight) return { lng: flight[5], lat: flight[6], alt: flight[7] || flight[13], speed: flight[9], heading: flight[10] };
        } catch (e) {} return null; 
    }

    // 4. Xử lý tìm kiếm chính
    async function searchFlight() {
        let input = flightInput.value.trim().toUpperCase();
        if (!input || !flightData[input]) return alert("Chuyến bay chưa có trong cơ sở dữ liệu demo (Thử VU750 hoặc VN300).");
        
        currentFlightCode = input;
        currentFlightInfo = flightData[input];
        suggestionsBox.style.display = 'none';

        document.getElementById('depCity').innerText = currentFlightInfo.dep;
        document.getElementById('arrCity').innerText = currentFlightInfo.arr;
        document.getElementById('depTime').innerText = currentFlightInfo.depTime;
        document.getElementById('arrTime').innerText = currentFlightInfo.arrTime;
        document.getElementById('airline').innerText = currentFlightInfo.airline;
        document.getElementById('result').style.display = 'block';

        if (liveGpsInterval) clearInterval(liveGpsInterval);

        initMap(currentFlightInfo.coords);
        updateFlightPosition();
        liveGpsInterval = setInterval(updateFlightPosition, 10000);
    }

    // 5. Cập nhật vị trí GPS hoặc Mô phỏng
    async function updateFlightPosition() {
        const icaoCallsign = getIcaoCallsign(currentFlightCode);
        const liveData = await fetchLiveGPS(icaoCallsign);
        
        const badge = document.getElementById('gpsBadge');
        const text = document.getElementById('gpsText');
        const statusEl = document.getElementById('status');

        if (liveData && liveData.lng && liveData.lat) {
            badge.className = "gps-badge";
            text.innerText = "LIVE GPS TỪ ADS-B";
            
            document.getElementById('altitude').innerText = Math.round(liveData.alt * 3.28084).toLocaleString() + " ft";
            document.getElementById('speed').innerText = Math.round(liveData.speed * 1.94384) + " kts";
            statusEl.innerText = "Đang bay (Real-time)";
            statusEl.style.color = "var(--success)";

            updatePlaneMarker([liveData.lng, liveData.lat], liveData.heading);
            map.flyTo({ center: [liveData.lng, liveData.lat], zoom: 6, speed: 0.5 });
        } else {
            badge.className = "gps-badge simulated";
            text.innerText = "MÔ PHỎNG TÍN HIỆU";
            
            document.getElementById('altitude').innerText = "32,000 ft (Dự kiến)";
            document.getElementById('speed').innerText = "450 kts (Dự kiến)";
            
            const progress = calculateProgress(currentFlightInfo.depTime, currentFlightInfo.arrTime);
            statusEl.innerText = progress.status;
            statusEl.style.color = (progress.percent === 0 || progress.percent === 100) ? "var(--text-muted)" : "var(--warning)";

            const start = [currentFlightInfo.coords[0][1], currentFlightInfo.coords[0][0]]; 
            const end = [currentFlightInfo.coords[1][1], currentFlightInfo.coords[1][0]];
            const route = turf.greatCircle(start, end);
            const routeLength = turf.length(route, { units: 'kilometers' });
            
            const currentDist = routeLength * (progress.percent / 100);
            const simPoint = turf.along(route, currentDist, { units: 'kilometers' });
            
            let bearing = 0;
            if (progress.percent < 100 && progress.percent > 0) {
                const nextPoint = turf.along(route, currentDist + 10, { units: 'kilometers' });
                bearing = turf.bearing(simPoint, nextPoint);
            }

            updatePlaneMarker(simPoint.geometry.coordinates, bearing);
        }
    }

    function calculateProgress(depTime, arrTime) {
        const now = new Date();
        const currentMins = now.getHours() * 60 + now.getMinutes();
        const depParts = depTime.split(':');
        const depMins = parseInt(depParts[0]) * 60 + parseInt(depParts[1]);
        let arrParts = arrTime.split(':');
        let arrMins = parseInt(arrParts[0]) * 60 + parseInt(arrParts[1]);
        if (arrMins < depMins) arrMins += 24 * 60;
        
        let progress = 0; let status = "";
        if (currentMins < depMins) { progress = 0; status = "Chờ khởi hành"; } 
        else if (currentMins > arrMins) { progress = 100; status = "Đã hạ cánh"; } 
        else { progress = ((currentMins - depMins) / (arrMins - depMins)) * 100; status = "Đang bay (Mất sóng)"; }
        return { percent: Math.min(Math.max(progress, 0), 100), status: status };
    }

    // 6. Khởi tạo & Cập nhật Bản đồ MapLibre
    function initMap(coords) {
        const start = [coords[0][1], coords[0][0]], end = [coords[1][1], coords[1][0]];
        const route = turf.greatCircle(start, end);

        if (!map) {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                center: start, zoom: 4, attributionControl: false
            });
            map.on('load', () => drawRouteLine(route));
        } else drawRouteLine(route);
    }

    function drawRouteLine(route) {
        if (map.getSource('flight-route')) map.getSource('flight-route').setData(route);
        else {
            map.addSource('flight-route', { type: 'geojson', data: route });
            map.addLayer({ id: 'flight-route', type: 'line', source: 'flight-route', paint: { 'line-color': '#38bdf8', 'line-width': 2, 'line-dasharray': [3, 4] } });
        }
        map.fitBounds(turf.bbox(route), { padding: 40, duration: 1000 });
    }

    function updatePlaneMarker(lngLat, bearing) {
        if (!planeMarker) {
            const el = document.createElement('div'); el.className = 'plane-marker';
            el.innerHTML = `<svg viewBox="0 0 512 512" fill="#f59e0b"><path d="M 256,16 224,48 224,192 16,288 16,352 224,304 224,432 176,464 176,496 256,480 336,496 336,464 288,432 288,304 496,352 496,288 288,192 288,48 Z"/></svg>`;
            planeMarker = new maplibregl.Marker({ element: el }).setLngLat(lngLat).addTo(map);
        } else planeMarker.setLngLat(lngLat);
        planeMarker.setRotation(bearing);
    }
</script>
</body>
</html>
