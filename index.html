<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Định Vị Toàn Cầu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

    <style>
        :root {
            --primary: #00e5ff;
            --primary-hover: #00b8cc;
            --bg-dark: #0f151f;
            --card-bg: #141c27;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --success: #00ffa3;
            --warning: #ffb300;
        }

        body { 
            font-family: 'Inter', sans-serif; background: var(--bg-dark); 
            color: var(--text-light); margin: 0; padding: 20px 10px; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh;
        }

        .container { max-width: 500px; width: 100%; }

        h2 { 
            text-align: center; color: var(--primary); margin: 10px 0 25px 0; 
            font-size: 22px; text-transform: uppercase; letter-spacing: 1px; 
            text-shadow: 0 0 10px rgba(0,229,255,0.4); 
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        
        .search-container { position: relative; width: 100%; margin-bottom: 25px; }
        .search-box { display: flex; width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        input[type="text"] { 
            flex: 1; padding: 16px 20px; font-size: 15px; 
            background: #111822; border: 1px solid #1e293b; border-right: none;
            color: white; outline: none; text-transform: uppercase; font-weight: 600;
        }
        input[type="text"]:focus { border-color: var(--primary); }
        button.search-btn { 
            padding: 0 25px; font-size: 15px; background: var(--primary); color: #000; 
            border: none; cursor: pointer; font-weight: 800; text-transform: uppercase;
        }
        
        .suggestions { 
            position: absolute; top: 100%; left: 0; right: 0; 
            background: #1e293b; border-radius: 0 0 8px 8px; z-index: 1000; display: none; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .suggestion-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #334155; font-size: 14px; }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: rgba(0, 229, 255, 0.1); color: var(--primary); }

        .result-card { 
            display: none; background: var(--card-bg); border-radius: 12px; 
            padding: 25px 20px; border: 1px solid #1e293b; position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: slide-up 0.4s ease-out forwards;
        }
        @keyframes slide-up { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Huy hiệu trạng thái trên cùng */
        .status-badge { 
            position: absolute; top: -14px; right: 20px; 
            background: #1e293b; color: #fff; border: 1px solid #334155;
            padding: 5px 15px; border-radius: 20px; font-size: 11px; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 6px; z-index: 10;
        }
        .status-badge.flying {
            background: rgba(0, 255, 163, 0.1); color: var(--success);
            border-color: rgba(0, 255, 163, 0.3);
            animation: soft-blink 2s infinite ease-in-out;
        }
        @keyframes soft-blink {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 163, 0.4); }
            50% { box-shadow: 0 0 10px 2px rgba(0, 255, 163, 0.2); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 163, 0); }
        }

        /* Lộ trình */
        .route { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
        .city-block { display: flex; flex-direction: column; width: 40%; }
        .city-block.left { text-align: left; align-items: flex-start; }
        .city-block.right { text-align: right; align-items: flex-end; }
        
        .city { font-size: 40px; font-weight: 800; color: #fff; line-height: 1.1; }
        .time { font-size: 18px; color: var(--primary); font-weight: 800; margin-top: 5px; text-shadow: 0 0 8px rgba(0,229,255,0.3);}
        .timezone-info { font-size: 10px; color: var(--text-muted); margin-top: 6px; font-weight: 600; text-transform: uppercase;}
        
        /* Thông tin Nhà ga & Cửa */
        .terminal-gate {
            font-size: 10px; color: #fff; margin-top: 8px; font-weight: 700; text-transform: uppercase;
            background: #1e293b; padding: 5px 8px; border-radius: 6px;
            border: 1px solid #334155; display: inline-block;
        }
        
        /* Nút link mở bản đồ địa điểm */
        .ext-map-link {
            font-size: 10px; color: var(--primary); text-decoration: none;
            margin-top: 6px; display: inline-flex; align-items: center; gap: 4px;
            font-weight: 800; text-transform: uppercase; transition: 0.3s;
        }
        .ext-map-link:hover { color: #fff; text-shadow: 0 0 8px var(--primary); }

        .flight-path { flex: 1; text-align: center; position: relative; margin: 25px 15px 0 15px; border-bottom: 2px dashed #334155; }
        .flight-path span { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--card-bg); padding: 0 10px; font-size: 20px; color: var(--primary); }

        .details { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            background: #0f151f; padding: 20px; border-radius: 10px; 
            margin-bottom: 25px; border: 1px solid #1e293b;
        }
        .detail-item { display: flex; flex-direction: column; gap: 4px; }
        .detail-label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        .detail-value { font-size: 15px; color: #fff; font-weight: 800; }
        .val-highlight { color: var(--primary); }
        .val-warning { color: var(--warning); }
        .val-success { color: var(--success); }
        
        .action-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap;}
        .btn-outline {
            background: transparent; color: var(--primary); border: 1px solid var(--primary);
            padding: 10px 18px; border-radius: 30px; font-size: 12px; font-weight: 800; 
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 6px;
            text-transform: uppercase;
        }
        .btn-outline:hover { background: rgba(0,229,255,0.1); }
        
        .btn-map { border-color: #64748b; color: #cbd5e1; }
        .btn-map.active { background: #1e293b; color: #fff; border-color: #fff;}

        /* Vùng bản đồ radar */
        #mapContainer { 
            display: none; 
            margin-top: 20px; border-top: 1px dashed #334155; padding-top: 20px;
            animation: fade-in 0.3s ease-out;
        }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        #map { height: 300px; width: 100%; border-radius: 10px; border: 1px solid #334155; }
        .plane-marker { width: 30px; height: 30px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.8)); transition: transform 0.5s linear; }
    </style>
</head>
<body>

<div class="container">
    <h2>✈️ RADAR ĐỊNH VỊ TOÀN CẦU</h2>
    
    <div class="search-container">
        <div class="search-box">
            <input type="text" id="flightInput" placeholder="Nhập mã (VD: VU750, VN300)" autocomplete="off">
            <button class="search-btn" onclick="searchFlight()">Tra Cứu</button>
        </div>
        <div id="suggestions" class="suggestions"></div>
    </div>

    <div id="result" class="result-card">
        <div id="statusBadge" class="status-badge">
            <span id="statusIcon">⏳</span> <span id="statusText">Đang tải...</span>
        </div>

        <div class="route">
            <!-- Điểm đi -->
            <div class="city-block left">
                <div id="depCity" class="city">SGN</div>
                <div id="depTime" class="time">05:35</div>
                <div id="depTz" class="timezone-info">GMT+7</div>
                
                <!-- Bổ sung thông tin Ga, Cửa, Tọa độ -->
                <div id="depTerminalGate" class="terminal-gate">GA T1 • CỬA 14</div>
                <a id="depMapLink" class="ext-map-link" href="#" target="_blank">📍 Bản đồ Ga đi</a>
            </div>
            
            <div class="flight-path"><span>✈️</span></div>
            
            <!-- Điểm đến -->
            <div class="city-block right">
                <div id="arrCity" class="city">HAN</div>
                <div id="arrTime" class="time">07:45</div>
                <div id="arrTz" class="timezone-info">GMT+7</div>
                
                <!-- Bổ sung thông tin Ga, Cửa, Tọa độ -->
                <div id="arrTerminalGate" class="terminal-gate">GA T1 • CỬA 03</div>
                <a id="arrMapLink" class="ext-map-link" href="#" target="_blank">📍 Bản đồ Ga đến</a>
            </div>
        </div>

        <div class="details">
            <div class="detail-item">
                <span class="detail-label">Hãng hàng không</span>
                <span class="detail-value" id="airline">Vietravel Airlines</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Nguồn Tín Hiệu</span>
                <span class="detail-value val-warning" id="signalType">Mô phỏng (Mất sóng)</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Độ cao (Alt)</span>
                <span class="detail-value val-highlight" id="altitude">32,000 ft (Dự kiến)</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Tốc độ (Speed)</span>
                <span class="detail-value val-highlight" id="speed">450 kts (Dự kiến)</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-outline" onclick="setNativeAlarm()">⏰ Đặt Lịch Báo Thức</button>
            <button id="toggleMapBtn" class="btn-outline btn-map" onclick="toggleMap()">🗺️ Radar Theo Dõi</button>
        </div>

        <div id="mapContainer">
            <div id="map"></div>
        </div>
    </div>
</div>

<script>
    const USER_TZ = 7;

    // Dữ liệu mở rộng chứa Ga, Cửa (Terminal, Gate)
    const flightData = {
        "VU750": { 
            dep: "SGN", arr: "HAN", depTime: "05:35", arrTime: "07:45", airline: "Vietravel Airlines", 
            depTz: 7, arrTz: 7, depTerminal: "T1 (Quốc nội)", depGate: "14", arrTerminal: "T1 (Quốc nội)", arrGate: "03",
            coords: [[10.818, 106.652], [21.218, 105.804]] 
        },
        "VN123": { 
            dep: "HAN", arr: "SGN", depTime: "10:00", arrTime: "12:15", airline: "Vietnam Airlines", 
            depTz: 7, arrTz: 7, depTerminal: "T1 (Quốc nội)", depGate: "08", arrTerminal: "T1 (Quốc nội)", arrGate: "15",
            coords: [[21.218, 105.804], [10.818, 106.652]] 
        },
        "VN300": { 
            dep: "SGN", arr: "NRT", depTime: "00:15", arrTime: "07:45", airline: "Vietnam Airlines", 
            depTz: 7, arrTz: 9, depTerminal: "T2 (Quốc tế)", depGate: "22", arrTerminal: "T1 (North Wing)", arrGate: "26",
            coords: [[10.818, 106.652], [35.772, 140.392]] 
        }, 
        "VJ198": { 
            dep: "SGN", arr: "HAN", depTime: "14:30", arrTime: "16:40", airline: "VietJet Air", 
            depTz: 7, arrTz: 7, depTerminal: "T1 (Quốc nội)", depGate: "Chưa cập nhật", arrTerminal: "T1", arrGate: "Chưa cập nhật",
            coords: [[10.818, 106.652], [21.218, 105.804]] 
        }
    };

    let map = null, planeMarker = null, liveGpsInterval = null;
    let currentFlightCode = "", currentFlightInfo = null;
    let isMapVisible = false;
    
    const flightInput = document.getElementById('flightInput');
    const suggestionsBox = document.getElementById('suggestions');

    flightInput.addEventListener('input', function() {
        const val = this.value.toUpperCase();
        suggestionsBox.innerHTML = '';
        if (!val) { suggestionsBox.style.display = 'none'; return; }
        
        let matches = Object.keys(flightData).filter(key => key.includes(val));
        if (matches.length > 0) {
            suggestionsBox.style.display = 'block';
            matches.forEach(match => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `<strong>${match}</strong> <span style="color:#64748b; margin-left:8px;">${flightData[match].airline}</span>`;
                div.onclick = function() {
                    flightInput.value = match;
                    suggestionsBox.style.display = 'none';
                    searchFlight();
                };
                suggestionsBox.appendChild(div);
            });
        } else { suggestionsBox.style.display = 'none'; }
    });
    document.addEventListener('click', e => { if(e.target !== flightInput) suggestionsBox.style.display = 'none'; });
    flightInput.addEventListener("keypress", e => { if (e.key === "Enter") { e.preventDefault(); searchFlight(); } });

    function setNativeAlarm() {
        if(!currentFlightInfo) return;
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const depTime = currentFlightInfo.depTime.replace(':', '');
        const arrTime = currentFlightInfo.arrTime.replace(':', '');

        const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Flight Tracker//VN\nCALSCALE:GREGORIAN\nBEGIN:VEVENT\nSUMMARY:✈️ Chuyến bay ${currentFlightCode} (${currentFlightInfo.dep} - ${currentFlightInfo.arr})\nDTSTART:${year}${month}${day}T${depTime}00\nDTEND:${year}${month}${day}T${arrTime}00\nDESCRIPTION:Hãng: ${currentFlightInfo.airline}\\nTheo dõi bởi Radar.\nBEGIN:VALARM\nTRIGGER:-PT120M\nACTION:DISPLAY\nDESCRIPTION:Nhắc nhở ra sân bay (Trước 2 tiếng)\nEND:VALARM\nEND:VEVENT\nEND:VCALENDAR`;

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = `ChuyenBay_${currentFlightCode}.ics`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function toggleMap() {
        const mapContainer = document.getElementById('mapContainer');
        const btn = document.getElementById('toggleMapBtn');
        isMapVisible = !isMapVisible;
        
        if (isMapVisible) {
            mapContainer.style.display = 'block';
            btn.innerHTML = '🗺️ ĐÓNG BẢN ĐỒ';
            btn.classList.add('active');
            if (map) map.resize(); 
        } else {
            mapContainer.style.display = 'none';
            btn.innerHTML = '🗺️ Radar Theo Dõi';
            btn.classList.remove('active');
        }
    }

    function formatTimezoneInfo(timeStr, flightTz) {
        let diff = USER_TZ - flightTz;
        let sign = flightTz >= 0 ? "+" : "";
        let tzStr = `GMT${sign}${flightTz}`;

        if (diff === 0) return `${tzStr} • Cùng múi giờ`;
        
        let [h, m] = timeStr.split(':').map(Number);
        let localH = h + diff;
        if (localH < 0) localH += 24;
        if (localH >= 24) localH -= 24;
        return `${tzStr} • ${String(localH).padStart(2, '0')}:${String(m).padStart(2, '0')} (VN)`;
    }

    async function searchFlight() {
        let input = flightInput.value.trim().toUpperCase();
        if (!input || !flightData[input]) return alert("Chuyến bay chưa có trong CSDL (Thử VU750 hoặc VN300).");
        
        currentFlightCode = input;
        currentFlightInfo = flightData[input];
        suggestionsBox.style.display = 'none';

        document.getElementById('depCity').innerText = currentFlightInfo.dep;
        document.getElementById('arrCity').innerText = currentFlightInfo.arr;
        document.getElementById('depTime').innerText = currentFlightInfo.depTime;
        document.getElementById('arrTime').innerText = currentFlightInfo.arrTime;
        document.getElementById('airline').innerText = currentFlightInfo.airline;
        
        document.getElementById('depTz').innerText = formatTimezoneInfo(currentFlightInfo.depTime, currentFlightInfo.depTz);
        document.getElementById('arrTz').innerText = formatTimezoneInfo(currentFlightInfo.arrTime, currentFlightInfo.arrTz);
        
        // ----------------------------------------------------
        // CẬP NHẬT GIAO DIỆN NHÀ GA (TERMINAL) VÀ CỬA (GATE)
        // ----------------------------------------------------
        document.getElementById('depTerminalGate').innerText = `GA ${currentFlightInfo.depTerminal} • CỬA ${currentFlightInfo.depGate}`;
        document.getElementById('arrTerminalGate').innerText = `GA ${currentFlightInfo.arrTerminal} • CỬA ${currentFlightInfo.arrGate}`;

        // GẮN LINK GOOGLE MAPS CHO NÚT (Sử dụng tọa độ sân bay có sẵn trong mảng coords)
        const depLat = currentFlightInfo.coords[0][0], depLng = currentFlightInfo.coords[0][1];
        const arrLat = currentFlightInfo.coords[1][0], arrLng = currentFlightInfo.coords[1][1];
        
        document.getElementById('depMapLink').href = `https://www.google.com/maps/search/?api=1&query=${depLat},${depLng}`;
        document.getElementById('arrMapLink').href = `https://www.google.com/maps/search/?api=1&query=${arrLat},${arrLng}`;

        document.getElementById('result').style.display = 'block';

        if (liveGpsInterval) clearInterval(liveGpsInterval);

        initMap(currentFlightInfo.coords);
        updateFlightPosition();
        liveGpsInterval = setInterval(updateFlightPosition, 10000);
    }

    async function fetchLiveGPS(iata) {
        let icao = iata;
        if(iata.startsWith('VU')) icao = iata.replace('VU', 'VTV');
        if(iata.startsWith('VN')) icao = iata.replace('VN', 'HVN');
        if(iata.startsWith('VJ')) icao = iata.replace('VJ', 'VJC');
        
        try {
            const res = await fetch('https://opensky-network.org/api/states/all?lamin=-10&lomin=90&lamax=50&lomax=150');
            const data = await res.json();
            if (!data || !data.states) return null;
            const flight = data.states.find(s => s[1] && s[1].trim() === icao);
            if (flight) return { lng: flight[5], lat: flight[6], alt: flight[7] || flight[13], speed: flight[9], heading: flight[10] };
        } catch (e) {} return null; 
    }

    async function updateFlightPosition() {
        const liveData = await fetchLiveGPS(currentFlightCode);
        
        const badge = document.getElementById('statusBadge');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const signalEl = document.getElementById('signalType');

        if (liveData && liveData.lng && liveData.lat) {
            badge.className = "status-badge flying";
            statusIcon.innerText = "🟢"; statusText.innerText = "Đang Bay";
            
            signalEl.innerText = "Live ADS-B"; signalEl.className = "detail-value val-success";
            document.getElementById('altitude').innerText = Math.round(liveData.alt * 3.28084).toLocaleString() + " ft";
            document.getElementById('speed').innerText = Math.round(liveData.speed * 1.94384) + " kts";
            
            updatePlaneMarker([liveData.lng, liveData.lat], liveData.heading);
            if(map) map.flyTo({ center: [liveData.lng, liveData.lat], zoom: 6, speed: 0.5 });
        } else {
            const p = calculateProgress(currentFlightInfo.depTime, currentFlightInfo.arrTime);
            
            badge.className = "status-badge";
            if (p.percent === 0) {
                statusIcon.innerText = "⏳"; statusText.innerText = "Chờ khởi hành";
            } else if (p.percent === 100) {
                statusIcon.innerText = "🛬"; statusText.innerText = "Đã hạ cánh";
            } else {
                badge.className = "status-badge flying";
                statusIcon.innerText = "✈️"; statusText.innerText = "Đang bay";
            }

            signalEl.innerText = "Mô phỏng (Mất sóng)"; signalEl.className = "detail-value val-warning";
            document.getElementById('altitude').innerText = "32,000 ft (Dự kiến)";
            document.getElementById('speed').innerText = "450 kts (Dự kiến)";
            
            const route = turf.greatCircle([currentFlightInfo.coords[0][1], currentFlightInfo.coords[0][0]], [currentFlightInfo.coords[1][1], currentFlightInfo.coords[1][0]]);
            const simPoint = turf.along(route, turf.length(route) * (p.percent / 100), { units: 'kilometers' });
            
            let bearing = 0;
            if (p.percent < 100 && p.percent > 0) bearing = turf.bearing(simPoint, turf.along(route, turf.length(route) * (p.percent / 100) + 10, { units: 'kilometers' }));
            updatePlaneMarker(simPoint.geometry.coordinates, bearing);
        }
    }

    function calculateProgress(depTime, arrTime) {
        const now = new Date();
        const cMins = now.getHours() * 60 + now.getMinutes();
        const dMins = parseInt(depTime.split(':')[0]) * 60 + parseInt(depTime.split(':')[1]);
        let aMins = parseInt(arrTime.split(':')[0]) * 60 + parseInt(arrTime.split(':')[1]);
        if (aMins < dMins) aMins += 24 * 60;
        
        if (cMins < dMins) return { percent: 0 };
        if (cMins > aMins) return { percent: 100 };
        return { percent: ((cMins - dMins) / (aMins - dMins)) * 100 };
    }

    function initMap(coords) {
        const route = turf.greatCircle([coords[0][1], coords[0][0]], [coords[1][1], coords[1][0]]);
        if (!map) {
            map = new maplibregl.Map({ container: 'map', style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', center: [coords[0][1], coords[0][0]], zoom: 4, attributionControl: false });
            map.on('load', () => drawRouteLine(route));
        } else {
            drawRouteLine(route);
            if(isMapVisible) map.resize();
        }
    }

    function drawRouteLine(route) {
        if (map.getSource('flight-route')) map.getSource('flight-route').setData(route);
        else {
            map.addSource('flight-route', { type: 'geojson', data: route });
            map.addLayer({ id: 'flight-route', type: 'line', source: 'flight-route', paint: { 'line-color': '#00e5ff', 'line-width': 2, 'line-dasharray': [2, 3] } });
        }
        map.fitBounds(turf.bbox(route), { padding: 40, duration: 0 });
    }

    function updatePlaneMarker(lngLat, bearing) {
        if (!planeMarker) {
            const el = document.createElement('div'); el.className = 'plane-marker';
            el.innerHTML = `<svg viewBox="0 0 512 512" fill="#ffb300"><path d="M 256,16 224,48 224,192 16,288 16,352 224,304 224,432 176,464 176,496 256,480 336,496 336,464 288,432 288,304 496,352 496,288 288,192 288,48 Z"/></svg>`;
            planeMarker = new maplibregl.Marker({ element: el }).setLngLat(lngLat).addTo(map);
        } else planeMarker.setLngLat(lngLat);
        planeMarker.setRotation(bearing);
    }
